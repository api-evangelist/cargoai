  /ai/shipment:
    post:
      summary: Shipment Data Extraction (Text, Image)
      description: Transform raw email data into accurate shipment information and remove manual data entry from your quote and book process. By far the easiest way to leverage powerful AI capabilities to supercharge your workflows.
      operationId: shipment-extraction
      parameters:
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - data
              - type
              properties:
                email:
                  type: string
                data:
                  type: string
                  description: raw text email for RAWTEXT type, or base64 encoded image for IMAGE and MULTI types
                type:
                  type: string
                  description: RAWTEXT (email only), IMAGE (image only), or MULTI (email + image)
                subject:
                  type: string
                emailBody:
                  type: string
                  description: email body data for MULTI type
            examples:
              email only:
                value:
                  email: test@gmail.com
                  data: 'Hello, Please take the following reservation according to the quotation below: Delivery Thursday 28/10, Origin CDG, Destination BKK, NON GERBABLE, Weight: 500KG - 2m3, Type of goods: Fresh products +2+8°C (no dry ice) Best regards.'
                  type: RAWTEXT
              image only:
                value:
                  email: ''
                  data: '{{base64_encoded_image}}'
                  subject: ''
                  type: IMAGE
              email + image:
                value:
                  email: ''
                  data: '{{base64_encoded_image}}'
                  emailBody: '{{email_chain}}'
                  subject: ''
                  type: MULTI
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\t\"origin\": \"CDG\",\n\t\"destination\": \"BKK\",\n\t\"date\": \"2024-10-28\",\n\t\"loadType\": \"PER\",\n\t\"weight\": 500,\n\t\"volume\": 2,\n\t\"dimensions\": [\n\t\t{\n\t\t\t\"pieces\": 2,\n\t\t\t\"length\": 140,\n\t\t\t\"width\": 100,\n\t\t\t\"height\": 120,\n\t\t\t\"weight\": 250,\n\t\t\t\"lengthUnit\": \"\",\n\t\t\t\"weightUnit\": \"kg\",\n\t\t\t\"stackable\": false\n\t\t}\n\t]\n}"
              schema:
                type: object
                properties:
                  origin:
                    type: string
                    example: CDG
                  destination:
                    type: string
                    example: BKK
                  date:
                    type: string
                    example: '2024-10-28'
                  loadType:
                    type: string
                    example: PER
                  weight:
                    type: integer
                    example: 500
                    default: 0
                  volume:
                    type: integer
                    example: 2
                    default: 0
                  dimensions:
                    type: array
                    items:
                      type: object
                      properties:
                        pieces:
                          type: integer
                          example: 2
                          default: 0
                        length:
                          type: integer
                          example: 140
                          default: 0
                        width:
                          type: integer
                          example: 100
                          default: 0
                        height:
                          type: integer
                          example: 120
                          default: 0
                        weight:
                          type: integer
                          example: 250
                          default: 0
                        lengthUnit:
                          type: string
                          example: ''
                        weightUnit:
                          type: string
                          example: kg
                        stackable:
                          type: boolean
                          example: false
                          default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"customer\": null\n}"
              schema:
                type: object
                properties:
                  customer: {}
      deprecated: false
      security: []
      tags:
      - Ai
