        description: API Key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - data
              - type
              properties:
                email:
                  type: string
                  description: Requester email address
                data:
                  type: string
                  description: Base64 encoded image for IMAGE
                type:
                  type: string
                  description: media type (image accepted only)
                  enum:
                  - IMAGE
            examples:
              request example:
                value:
                  email: ops@forwarder.com
                  type: IMAGE
                  data: <base64-encoded-awb-image>
