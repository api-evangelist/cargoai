aid: cargoai
url: https://raw.githubusercontent.com/api-evangelist/cargoai/refs/heads/main/apis.yml
name: CargoAi
kind: company
description: CargoAi is a Singapore-headquartered air cargo technology company that
  operates CargoMART, a digital marketplace where freight forwarders search routes,
  schedules, capacity and rates across 680+ airlines, book them, transmit the electronic
  air waybill, and track the shipment end to end. It sits in the middle of the air
  cargo chain as an aggregator between forwarders and their TMS vendors on one side
  and airline reservation and messaging systems on the other. Its API posture is
  genuinely public in documentation and sales-gated in access - the CargoCONNECT
  developer portal at cargoai.readme.io is open to anyone with no login and publishes
  a real OpenAPI 3.1 definition per operation, but an x-api-key is issued only after
  a commercial conversation with the CargoAi enterprise team. The published contract
  is a proprietary REST shape rather than an IATA ONE Record interface, though the
  payloads it carries are IATA-native - AWB numbers with airline prefixes, IATA
  airport and airline codes, Special Handling Codes, IATA cargo status event codes,
  FWB and FHL message content, and CO2 figures computed per IATA Recommended
  Practice 1678.
imageNote: >-
  The `image` property was removed on 2026-08-26. It had been copied verbatim out of a
  bootstrap template and pointed at an icon belonging to groq, not to this company.
  That asset returns HTTP 200, so the record rendered another company's brand
  rather than a broken image, which is why it went unreported (roadmap#153).
  No correct icon has been sourced yet. Shipping the wrong company's mark is worse
  than shipping none; re-run the icon backfill once a real asset exists.
tags:
- Logistics
- Supply Chain
- Singapore
- Air Cargo
- Freight Forwarding
- Track and Trace
- Booking
- Marketplace
- Standards
