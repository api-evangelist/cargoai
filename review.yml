aid: cargoai
name: CargoAi
review:
  question: >-
    Does CargoAi publish a real, callable API surface for air cargo, and can what it
    publishes be spoken by the next party in the chain?
  answer: true
  date: '2026-07-30'
  reviewer: API Evangelist
  cohort: air-cargo-parcel
  tier: air-cargo-marketplace
  homeCountry: Singapore
identity:
  legalPresence: Singapore (Block 71 Ayer Rajah Crescent innovation district address published
    on third-party company records; CargoAi's LinkedIn presence is sg.linkedin.com/company/cargoai)
  domainNote: >-
    The roster hint domain was cargoai.com. That host resolves and returns HTTP 200 but
    serves only a parking lander (a script redirect to /lander) and is NOT operated by this
    organization. The real primary domain is cargoai.co, confirmed by the marketing site,
    the app (app.cargoai.co), the API host (api.cargoai.co), the help center
    (help.cargoai.co) and the corporate email domain used in the docs (support@cargoai.co).
  whatItIs: >-
    An air cargo marketplace and technology platform. CargoMART is the forwarder-facing
    portal for search, quote, book and track across 680+ airlines; CargoCONNECT is the
    API suite that exposes the same data and transactions into a customer's own TMS or
    ERP; Cargo2ZERO is the emissions layer; CargoWALLET is the freight payment layer;
    CargoCOPILOT is the AI extraction/agent layer.
  positionInChain: >-
    Aggregator sitting between freight forwarders (and their TMS vendors) and airline
    reservation, rating and messaging systems. It does not fly cargo and does not clear
    customs; it normalizes many airlines behind one contract and pushes documents and
    milestones back out.
